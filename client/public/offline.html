<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F6" />
    <title>Silver Shield — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f4f6;
        color: #111827;
        font-size: 20px;
      }
      .card {
        max-width: 560px;
        margin: 24px;
        padding: 32px;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid rgba(17, 24, 39, 0.1);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
      }
      p {
        line-height: 1.7;
        color: #4b5563;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 16px 28px;
        border-radius: 16px;
        background: #f77f00;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Silver Shield needs the internet connection on this computer to check your files and calls. Everything else on your computer is fine.</p>
      <p>When you are back online, open this page again.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
